<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Gradient definitions matching the site theme -->
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>

    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle with gradient -->
  <circle cx="250" cy="250" r="230" fill="url(#primaryGradient)" opacity="0.1"/>

  <!-- Open box icon (3D perspective) -->
  <g transform="translate(250, 200)">
    <!-- Box back panel -->
    <polygon points="-80,-40 0,-80 80,-40 80,20 0,60 -80,20"
             fill="url(#primaryGradient)"
             opacity="0.6"/>

    <!-- Box left side -->
    <polygon points="-80,-40 -80,20 0,60 0,0"
             fill="url(#primaryGradient)"
             opacity="0.8"/>

    <!-- Box right side -->
    <polygon points="80,-40 80,20 0,60 0,0"
             fill="url(#primaryGradient)"/>

    <!-- Box top (open lid) -->
    <g transform="rotate(-20, 0, -40)">
      <polygon points="-80,-40 0,-80 80,-40 0,0"
               fill="url(#accentGradient)"
               filter="url(#glow)"/>
    </g>

    <!-- Source code symbols inside box -->
    <g opacity="0.9">
      <!-- < symbol -->
      <text x="-40" y="25" font-family="'Courier New', monospace"
            font-size="40" font-weight="bold"
            fill="white" text-anchor="middle">&lt;</text>

      <!-- / symbol -->
      <text x="0" y="25" font-family="'Courier New', monospace"
            font-size="40" font-weight="bold"
            fill="white" text-anchor="middle">/</text>

      <!-- > symbol -->
      <text x="40" y="25" font-family="'Courier New', monospace"
            font-size="40" font-weight="bold"
            fill="white" text-anchor="middle">&gt;</text>
    </g>

    <!-- Sparkle/shine effects -->
    <circle cx="-60" cy="-50" r="3" fill="#00f2fe" opacity="0.8">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="70" cy="-30" r="2" fill="#00f2fe" opacity="0.6">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="-90" r="2.5" fill="#4facfe" opacity="0.7">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Text: OpenSourceBox -->
  <g transform="translate(250, 350)">
    <!-- "Open" -->
    <text x="0" y="0"
          font-family="'Inter', 'Arial', sans-serif"
          font-size="48"
          font-weight="800"
          text-anchor="middle"
          fill="url(#primaryGradient)"
          letter-spacing="-1">OpenSource<tspan font-weight="900" fill="url(#accentGradient)">Box</tspan></text>
  </g>

  <!-- Tagline -->
  <text x="250" y="400"
        font-family="'Inter', 'Arial', sans-serif"
        font-size="16"
        font-weight="600"
        text-anchor="middle"
        fill="#718096"
        letter-spacing="0.5">AI • Machine Learning • Open Source</text>
</svg>
