<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="favAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="url(#favGrad)"/>

  <!-- Box icon -->
  <g transform="translate(50, 45)">
    <polygon points="-18,-10 0,-18 18,-10 18,5 0,13 -18,5"
             fill="#ffffff" opacity="0.3"/>
    <polygon points="-18,-10 -18,5 0,13 0,-2"
             fill="#ffffff" opacity="0.5"/>
    <polygon points="18,-10 18,5 0,13 0,-2"
             fill="#ffffff" opacity="0.7"/>

    <!-- Lid -->
    <g transform="rotate(-15, 0, -10)">
      <polygon points="-18,-10 0,-18 18,-10 0,-2"
               fill="url(#favAccent)"/>
    </g>

    <!-- Code symbol -->
    <text x="0" y="8" font-family="monospace" font-size="14" font-weight="bold" fill="white" text-anchor="middle">&lt;/&gt;</text>
  </g>
</svg>
