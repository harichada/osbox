<!-- Custom Styles for Exciting Design -->
<link rel="stylesheet" href="{{ "css/custom.css" | absURL }}">

<!-- Favicons -->
<link rel="icon" type="image/svg+xml" href="{{ "favicon.svg" | absURL }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ "images/logo-icon.svg" | absURL }}">
<link rel="apple-touch-icon" href="{{ "images/logo-icon.svg" | absURL }}">

<!-- Meta Tags -->
<meta name="theme-color" content="#667eea">
